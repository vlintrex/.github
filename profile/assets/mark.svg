<svg xmlns="http://www.w3.org/2000/svg" viewBox="-250 -250 500 500" width="500" height="500" role="img" aria-label="Vlintrex">
<style>.in{animation:in 1.1s cubic-bezier(.16,1,.3,1) both} .navy{--x:0;--y:-64px} .teal{--x:64px;--y:0;animation-delay:.08s} .sky{--x:0;--y:64px;animation-delay:.16s} .peri{--x:-64px;--y:0;animation-delay:.24s} .band{animation:lock .35s ease-out 1.05s both} .b{animation:breathe 7s cubic-bezier(.45,0,.55,1) -2s infinite} .navy .b{--u:-7px;--v:0} .teal .b{--u:0;--v:-7px} .sky .b{--u:7px;--v:0} .peri .b{--u:0;--v:7px} .glow{animation:glow 7s cubic-bezier(.45,0,.55,1) -2s infinite} @keyframes in{from{opacity:0;transform:translate(var(--x),var(--y))}} @keyframes lock{from{opacity:0}} @keyframes breathe{0%,64%,100%{transform:none}78%,86%{transform:translate(var(--u),var(--v))}} @keyframes glow{0%,64%,100%{opacity:0}78%,86%{opacity:1}} @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
